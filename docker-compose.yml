version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bj_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bj_backend
    ports:
      - "8000:8000"
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    depends_on:
      - mosquitto
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bj_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
